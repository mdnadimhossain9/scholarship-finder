<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Graduation cap board (diamond shape) -->
  <polygon
    points="32,12 54,23 32,34 10,23"
    fill="url(#cap)"
    opacity="1"
  />

  <!-- Cap shine highlight -->
  <polygon
    points="32,12 54,23 43,28.5 32,23.5 21,28.5 10,23"
    fill="white"
    opacity="0.2"
  />

  <!-- Left side of mortarboard body -->
  <path
    d="M16,26 L16,38 Q16,41 20,42.5 L32,47 L32,34 L16,26 Z"
    fill="white"
    opacity="0.85"
  />

  <!-- Right side of mortarboard body -->
  <path
    d="M48,26 L48,38 Q48,41 44,42.5 L32,47 L32,34 L48,26 Z"
    fill="white"
    opacity="0.65"
  />

  <!-- Tassel string -->
  <line x1="54" y1="23" x2="54" y2="38" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Tassel bob -->
  <circle cx="54" cy="40" r="3" fill="#fbbf24"/>

  <!-- Tassel fringe lines -->
  <line x1="52" y1="40" x2="50" y2="46" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="43" x2="53" y2="49" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="40" x2="58" y2="46" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
</svg>